name: Checkapp CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: checkapp
          POSTGRES_PASSWORD: checkapp
          POSTGRES_DB: checkapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkapp -d checkapp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://checkapp:checkapp@localhost:5432/checkapp_test
      TEST_DATABASE_URL: postgresql://checkapp:checkapp@localhost:5432/checkapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
